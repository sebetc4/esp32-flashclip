[workspace]
resolver = "3"
members  = ["firmware", "protocol"]
# The firmware builds only for the ESP32-C3, from its own folder, where
# `firmware/.cargo/config.toml` sets the target: a cargo command run here
# works on the protocol alone, on the host.
default-members = ["protocol"]

[workspace.package]
edition      = "2024"
rust-version = "1.95"
version      = "0.1.0"
license      = "MIT OR Apache-2.0"
publish      = false

# The default debug profile is too slow and too big for the chip.
[profile.dev]
opt-level = "s"

[profile.release]
codegen-units = 1
debug         = 2
lto           = "fat"
opt-level     = "s"
